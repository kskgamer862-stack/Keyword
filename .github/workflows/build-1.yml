name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id("com.android.application") version "8.5.2"
                  id("org.jetbrains.kotlin.android") version "1.9.24"
              }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MousePointer"
          include(":app")
          EOF_FILE
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.mousepointer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mousepointer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Mouse Pointer"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PointerService"
                      android:exported="true"
                      android:label="Mouse Pointer"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/xml/accessibility_config.xml)"
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF_FILE
          mkdir -p "$(dirname app/src/main/res/values/strings.xml)"
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="service_desc">Shows a mouse pointer and touchpad. Used only to tap, swipe and scroll where the pointer is.</string>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/example/mousepointer/MainActivity.kt)"
          cat > app/src/main/java/com/example/mousepointer/MainActivity.kt <<'EOF_FILE'
          package com.example.mousepointer

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  box.addView(TextView(this).apply {
                      textSize = 18f
                      text = "Mouse Pointer\n\n1. Tap the button below.\n" +
                          "2. Open 'Installed apps' (or 'Downloaded apps') > Mouse Pointer.\n" +
                          "3. Turn it ON and allow.\n\n" +
                          "A pointer and a touchpad will appear. To stop, turn the service OFF."
                  })
                  box.addView(Button(this).apply {
                      text = "Open Accessibility Settings"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  setContentView(box)
              }
          }
          EOF_FILE
          mkdir -p "$(dirname app/src/main/java/com/example/mousepointer/PointerService.kt)"
          cat > app/src/main/java/com/example/mousepointer/PointerService.kt <<'EOF_FILE'
          package com.example.mousepointer

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.min

          class PointerService : AccessibilityService() {

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private var cursor: View? = null
              private var pad: FrameLayout? = null
              private var kb: KeyboardView? = null
              private var map: FrameLayout? = null
              private lateinit var cLp: WindowManager.LayoutParams
              private lateinit var pLp: WindowManager.LayoutParams
              private lateinit var kLp: WindowManager.LayoutParams

              private var sw = 0
              private var sh = 0
              private var cx = 0f
              private var cy = 0f
              private var speed = 2f
              private var collapsed = false
              private var padOnEnd = true

              private var lastX = 0f
              private var lastY = 0f
              private var moved = 0f
              private var downTime = 0L
              private var scrolling = false
              private var sdx = 0f
              private var sdy = 0f
              private var holding = false
              private var holdBtn: TextView? = null

              private val prefs by lazy { getSharedPreferences("kb", Context.MODE_PRIVATE) }
              private val names = listOf("Q", "E", "R", "F", "1", "2", "3", "4", "SHIFT", "SPACE", "CTRL")
              private val wasd = HashSet<String>()
              private var joyOn = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private val toolbarH get() = dp(44)
              private val padH get() = if (collapsed) toolbarH else dp(240)
              private val padW get() = min(dp(300), sw)

              // ================= multi-touch manager =================
              private class Pt(var x: Float, var y: Float) {
                  var lx = x
                  var ly = y
                  var stroke: GestureDescription.StrokeDescription? = null
                  var release = false
              }

              private val pts = LinkedHashMap<String, Pt>()
              private var busy = false
              private var tapN = 0

              private val cb = object : GestureResultCallback() {
                  override fun onCompleted(g: GestureDescription?) { busy = false; step() }
                  override fun onCancelled(g: GestureDescription?) {
                      busy = false
                      pts.values.forEach { it.stroke = null }
                      pts.entries.removeAll { it.value.release }
                      step()
                  }
              }

              private fun touchDown(id: String, x: Float, y: Float) {
                  val old = pts[id]
                  if (old != null) { old.release = false; old.x = x; old.y = y; return }
                  if (pts.size >= 9) return
                  pts[id] = Pt(x, y)
                  if (!busy) step()
              }

              private fun touchMove(id: String, x: Float, y: Float) {
                  pts[id]?.let { if (!it.release) { it.x = x; it.y = y } }
              }

              private fun touchUp(id: String) {
                  pts[id]?.release = true
                  if (!busy) step()
              }

              private fun step() {
                  if (busy || pts.isEmpty()) return
                  val b = GestureDescription.Builder()
                  val it = pts.values.iterator()
                  while (it.hasNext()) {
                      val p = it.next()
                      val same = p.x == p.lx && p.y == p.ly
                      val path = Path().apply { moveTo(p.lx, p.ly); lineTo(p.x + (if (same) 0.1f else 0f), p.y) }
                      val more = !p.release
                      val s = p.stroke?.continueStroke(path, 0, 40, more)
                          ?: GestureDescription.StrokeDescription(path, 0, 40, more)
                      b.addStroke(s)
                      p.stroke = s; p.lx = p.x; p.ly = p.y
                      if (p.release) it.remove()
                  }
                  busy = true
                  dispatchGesture(b.build(), cb, null)
              }

              private fun tap(x: Float, y: Float, holdMs: Long) {
                  val id = "t${tapN++}"
                  touchDown(id, x, y)
                  handler.postDelayed({ touchUp(id) }, holdMs)
              }

              private fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, ms: Long) {
                  val id = "s${tapN++}"
                  touchDown(id, x1, y1)
                  val n = 6
                  for (i in 1..n) handler.postDelayed({
                      touchMove(id, x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n)
                  }, ms * i / n)
                  handler.postDelayed({ touchUp(id) }, ms + 60)
              }

              // ================= setup =================
              private fun updateScreen() {
                  val m = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(m)
                  sw = m.widthPixels
                  sh = m.heightPixels
              }

              override fun onServiceConnected() {
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  updateScreen()
                  cx = sw / 2f
                  cy = sh / 3f
                  addCursor()
                  addPad()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (pad == null) return
                  updateScreen()
                  pLp.width = padW
                  wm.updateViewLayout(pad, pLp)
                  relayoutKb()
                  moveCursor()
              }

              private fun baseLp(w: Int, h: Int, extraFlags: Int) = WindowManager.LayoutParams(
                  w, h,
                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or extraFlags,
                  PixelFormat.TRANSLUCENT
              )

              private class CursorView(ctx: Context) : View(ctx) {
                  private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                  private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.BLACK; style = Paint.Style.STROKE; strokeWidth = 3f
                  }
                  override fun onDraw(c: Canvas) {
                      val s = width / 24f
                      val p = Path().apply {
                          moveTo(3 * s, 2 * s); lineTo(10 * s, 21 * s)
                          lineTo(12.6f * s, 13.4f * s); lineTo(20 * s, 11 * s); close()
                      }
                      c.drawPath(p, fill); c.drawPath(p, line)
                  }
              }

              private fun addCursor() {
                  cursor = CursorView(this)
                  cLp = baseLp(dp(30), dp(30), WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = cx.toInt(); y = cy.toInt()
                  }
                  wm.addView(cursor, cLp)
              }

              private fun moveCursor() {
                  cx = cx.coerceIn(0f, sw - 2f)
                  cy = cy.coerceIn(0f, sh - 2f)
                  val inPad = if (padOnEnd) cx >= sw - padW else cx < padW
                  if (inPad && cy >= sh - padH - 2) cy = (sh - padH - 3).toFloat()
                  cLp.x = cx.toInt(); cLp.y = cy.toInt()
                  wm.updateViewLayout(cursor, cLp)
                  if (holding) touchMove("mouse", cx, cy)
              }

              // ================= touchpad =================
              private fun btn(label: String, onClick: (TextView) -> Unit) = TextView(this).apply {
                  text = label
                  setTextColor(Color.WHITE)
                  textSize = 14f
                  gravity = Gravity.CENTER
                  setBackgroundColor(0xFF444444.toInt())
                  layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                      .apply { setMargins(2, 3, 2, 3) }
                  setOnClickListener { onClick(this) }
              }

              private fun relayoutPad() {
                  pLp.width = padW
                  pLp.height = padH
                  pLp.gravity = Gravity.BOTTOM or (if (padOnEnd) Gravity.END else Gravity.START)
                  wm.updateViewLayout(pad, pLp)
                  relayoutKb()
                  moveCursor()
              }

              private fun addPad() {
                  val p = FrameLayout(this)
                  p.setBackgroundColor(0x99222222.toInt())

                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  bar.addView(btn("◀") { performGlobalAction(GLOBAL_ACTION_BACK) })
                  bar.addView(btn("●") { performGlobalAction(GLOBAL_ACTION_HOME) })
                  bar.addView(btn("▣") { performGlobalAction(GLOBAL_ACTION_RECENTS) })
                  holdBtn = btn("✋") { toggleHold() }
                  bar.addView(holdBtn)
                  bar.addView(btn("⇄") { padOnEnd = !padOnEnd; relayoutPad() })
                  bar.addView(btn("2x") { b ->
                      speed = if (speed >= 4f) 1f else speed + 1f
                      b.text = "${speed.toInt()}x"
                  })
                  bar.addView(btn("▼") { b ->
                      collapsed = !collapsed
                      b.text = if (collapsed) "▲" else "▼"
                      relayoutPad()
                  })
                  p.addView(bar, FrameLayout.LayoutParams(-1, toolbarH, Gravity.TOP))

                  val bar2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  bar2.addView(btn("⌨ Keys") { toggleKb() })
                  bar2.addView(btn("🎯 Map") { showMap() })
                  p.addView(bar2, FrameLayout.LayoutParams(-1, toolbarH, Gravity.TOP).apply { topMargin = toolbarH })

                  p.setOnTouchListener { _, e -> onPadTouch(e); true }

                  pad = p
                  pLp = baseLp(padW, padH, 0).apply { gravity = Gravity.BOTTOM or Gravity.END }
                  wm.addView(p, pLp)
              }

              private fun onPadTouch(e: MotionEvent) {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastX = e.x; lastY = e.y; moved = 0f
                          downTime = SystemClock.uptimeMillis()
                          scrolling = false; sdx = 0f; sdy = 0f
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          scrolling = true
                          lastX = (e.getX(0) + e.getX(1)) / 2
                          lastY = (e.getY(0) + e.getY(1)) / 2
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (e.pointerCount >= 2) {
                              val ax = (e.getX(0) + e.getX(1)) / 2
                              val ay = (e.getY(0) + e.getY(1)) / 2
                              sdx += ax - lastX; sdy += ay - lastY
                              lastX = ax; lastY = ay
                          } else if (!scrolling) {
                              val dx = (e.x - lastX) * speed
                              val dy = (e.y - lastY) * speed
                              moved += abs(dx) + abs(dy)
                              cx += dx; cy += dy
                              lastX = e.x; lastY = e.y
                              moveCursor()
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!holding) {
                              if (scrolling) {
                                  val ex = (cx - sdx * 3).coerceIn(1f, sw - 2f)
                                  val ey = (cy + sdy * 3).coerceIn(1f, sh - 2f)
                                  swipe(cx, cy, ex, ey, 300)
                              } else if (moved < 15f) {
                                  val held = SystemClock.uptimeMillis() - downTime
                                  tap(cx, cy, if (held > 500) 700 else 50)
                              }
                          }
                          scrolling = false
                      }
                  }
              }

              private fun toggleHold() {
                  holding = !holding
                  if (holding) touchDown("mouse", cx, cy) else touchUp("mouse")
                  holdBtn?.setBackgroundColor(if (holding) 0xFFC0392B.toInt() else 0xFF444444.toInt())
              }

              // ================= game keyboard =================
              private class KeyboardView(ctx: Context, val onKey: (String, Boolean) -> Unit) : View(ctx) {
                  class K(val label: String, val c: Int, val r: Int, val span: Int = 1)

                  private val keys = listOf(
                      K("W", 1, 0), K("A", 0, 1), K("S", 1, 1), K("D", 2, 1),
                      K("Q", 3, 0), K("E", 4, 0), K("R", 5, 0), K("F", 6, 0),
                      K("1", 3, 1), K("2", 4, 1), K("3", 5, 1), K("4", 6, 1),
                      K("SHIFT", 0, 2, 2), K("SPACE", 2, 2, 4), K("CTRL", 6, 2)
                  )
                  private val down = HashMap<Int, K>()
                  private val bg = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val tx = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE; textAlign = Paint.Align.CENTER
                  }

                  private fun cell() = min(width / 7f, height / 3f)

                  private fun rect(k: K): RectF {
                      val c = cell(); val g = c * 0.06f
                      return RectF(k.c * c + g, k.r * c + g, (k.c + k.span) * c - g, (k.r + 1) * c - g)
                  }

                  override fun onDraw(cv: Canvas) {
                      tx.textSize = cell() * 0.32f
                      for (k in keys) {
                          val r = rect(k)
                          val on = down.values.contains(k)
                          bg.color = if (on) 0xFFC0392B.toInt()
                          else if (k.label in listOf("W", "A", "S", "D")) 0xCC1F4E79.toInt() else 0xCC333333.toInt()
                          cv.drawRoundRect(r, 14f, 14f, bg)
                          cv.drawText(k.label, r.centerX(), r.centerY() + tx.textSize / 3, tx)
                      }
                  }

                  override fun onTouchEvent(e: MotionEvent): Boolean {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                              val i = e.actionIndex
                              val k = keys.firstOrNull { rect(it).contains(e.getX(i), e.getY(i)) }
                              if (k != null) { down[e.getPointerId(i)] = k; onKey(k.label, true) }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                              val k = down.remove(e.getPointerId(e.actionIndex))
                              if (k != null) onKey(k.label, false)
                          }
                          MotionEvent.ACTION_CANCEL -> releaseAll()
                      }
                      invalidate()
                      return true
                  }

                  fun releaseAll() {
                      val l = down.values.toList()
                      down.clear()
                      l.forEach { onKey(it.label, false) }
                  }

                  override fun onDetachedFromWindow() {
                      releaseAll()
                      super.onDetachedFromWindow()
                  }
              }

              private fun toggleKb() {
                  val cur = kb
                  if (cur != null) { wm.removeView(cur); kb = null; return }
                  kb = KeyboardView(this) { k, d -> onKey(k, d) }
                  kLp = baseLp(dp(200), dp(150), 0)
                  wm.addView(kb, kLp)
                  relayoutKb()
              }

              private fun relayoutKb() {
                  val v = kb ?: return
                  val portrait = sh > sw
                  kLp.width = if (portrait) sw else (sw - padW).coerceAtLeast(dp(200))
                  kLp.height = dp(150)
                  kLp.gravity = Gravity.BOTTOM or (if (portrait || padOnEnd) Gravity.START else Gravity.END)
                  kLp.x = 0
                  kLp.y = if (portrait) padH else 0
                  wm.updateViewLayout(v, kLp)
              }

              private fun pos(n: String): Pair<Float, Float> {
                  val i = names.indexOf(n)
                  val dx = if (i < 0) 0.15f else 0.62f + 0.09f * (i % 4)
                  val dy = if (i < 0) 0.7f else 0.2f + 0.14f * (i / 4)
                  return Pair(prefs.getFloat("x_$n", dx) * sw, prefs.getFloat("y_$n", dy) * sh)
              }

              private var joyR: Float
                  get() = prefs.getFloat("joyR", dp(45).toFloat())
                  set(v) { prefs.edit().putFloat("joyR", v).apply() }

              private fun onKey(label: String, down: Boolean) {
                  if (label == "W" || label == "A" || label == "S" || label == "D") {
                      if (down) wasd.add(label) else wasd.remove(label)
                      updateJoy()
                  } else {
                      val (x, y) = pos(label)
                      if (down) touchDown("k$label", x, y) else touchUp("k$label")
                  }
              }

              private fun updateJoy() {
                  val dx = (if ("D" in wasd) 1 else 0) - (if ("A" in wasd) 1 else 0)
                  val dy = (if ("S" in wasd) 1 else 0) - (if ("W" in wasd) 1 else 0)
                  val (jx, jy) = pos("JOY")
                  if (dx == 0 && dy == 0) {
                      if (joyOn) { touchUp("joy"); joyOn = false }
                      return
                  }
                  val len = hypot(dx.toFloat(), dy.toFloat())
                  if (!joyOn) { touchDown("joy", jx, jy); joyOn = true }
                  touchMove("joy", jx + dx / len * joyR, jy + dy / len * joyR)
              }

              // ================= map mode: place keys on game buttons =================
              private fun showMap() {
                  if (map != null) return
                  val layer = FrameLayout(this)
                  layer.setBackgroundColor(0x55000000)

                  fun marker(n: String, size: Int, color: Int): TextView {
                      val t = TextView(this)
                      t.text = if (n == "JOY") "WASD" else n
                      t.setTextColor(Color.WHITE); t.textSize = 11f; t.gravity = Gravity.CENTER
                      t.background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL; setColor(color); setStroke(3, Color.WHITE)
                      }
                      t.tag = n
                      layer.addView(t, FrameLayout.LayoutParams(size, size))
                      val (px, py) = pos(n)
                      t.x = px - size / 2f; t.y = py - size / 2f
                      var ox = 0f; var oy = 0f
                      t.setOnTouchListener { v, e ->
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { ox = e.rawX - v.x; oy = e.rawY - v.y }
                              MotionEvent.ACTION_MOVE -> { v.x = e.rawX - ox; v.y = e.rawY - oy }
                          }
                          true
                      }
                      return t
                  }

                  val joy = marker("JOY", (joyR * 2).toInt(), 0x883498DB.toInt())
                  names.forEach { marker(it, dp(46), 0xAAC0392B.toInt()) }

                  fun tb(label: String, f: () -> Unit) = TextView(this).apply {
                      text = label; setTextColor(Color.WHITE); textSize = 15f
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      setOnClickListener { f() }
                  }
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(0xEE222222.toInt())
                  }
                  bar.addView(tb("Ring −") { resizeJoy(joy, -dp(6)) })
                  bar.addView(tb("Ring +") { resizeJoy(joy, dp(6)) })
                  bar.addView(tb("✔ Save") { saveMap(layer) })
                  layer.addView(bar, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.CENTER_HORIZONTAL))

                  map = layer
                  wm.addView(layer, baseLp(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, 0))
              }

              private fun resizeJoy(v: View, d: Int) {
                  val cxm = v.x + v.width / 2f
                  val cym = v.y + v.height / 2f
                  val r = (joyR + d).coerceIn(dp(20).toFloat(), dp(120).toFloat())
                  joyR = r
                  val s = (r * 2).toInt()
                  v.layoutParams = FrameLayout.LayoutParams(s, s)
                  v.x = cxm - s / 2f; v.y = cym - s / 2f
              }

              private fun saveMap(layer: FrameLayout) {
                  val ed = prefs.edit()
                  for (i in 0 until layer.childCount) {
                      val v = layer.getChildAt(i)
                      val n = v.tag as? String ?: continue
                      ed.putFloat("x_$n", (v.x + v.width / 2f) / sw)
                      ed.putFloat("y_$n", (v.y + v.height / 2f) / sh)
                  }
                  ed.apply()
                  try { wm.removeView(layer) } catch (_: Exception) {}
                  map = null
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try { kb?.let { wm.removeView(it) } } catch (_: Exception) {}
                  try { map?.let { wm.removeView(it) } } catch (_: Exception) {}
                  try { cursor?.let { wm.removeView(it) } } catch (_: Exception) {}
                  try { pad?.let { wm.removeView(it) } } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MousePointer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
